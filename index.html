<body>
  <div class="shell">
    <header class="top">
      <button class="brand" data-view="home" aria-label="返回忆格首页"><span class="brand-icon" aria-hidden="true">忆</span><span><strong>忆格</strong><small>间隔记忆卡 · 离线学习</small></span></button>
      <nav class="nav" aria-label="主导航"><button data-view="home" class="active">今日</button><button data-view="decks">卡组</button><button data-view="cards">卡片</button><button data-view="add">添加卡片</button><button data-view="backup">备份</button></nav>
    </header>
    <main id="content" class="content" tabindex="-1"></main>
    <footer class="footer">卡片和复习记录只保存在当前浏览器。记得定期导出备份，换设备时再导入。<br>忆格是独立的学习网页，复习灵感来自 Anki；不连接 AnkiWeb。</footer>
  </div>
  <div id="notice" class="notice hidden" role="status" aria-live="polite"></div>
  <input id="importFile" type="file" accept=".json,.csv,.txt,text/csv,text/plain,application/json" class="hidden">
  <script>
  (()=>{
    const KEY='yige-ipad-v1';
    const DAILY_LIMIT=30;
    const MARKJI_TOTAL=2299;
    const MARKJI_SUBJECTS=['马原','史纲','其他','毛中特','新思想','思法','时政','未分科'];
    const samples=[
      {deck:'试用卡组',front:'间隔重复的核心是什么？',back:'在记忆即将变淡时再次回忆，让每次复习都发生在更合适的时间。',tags:'示例'},
      {deck:'试用卡组',front:'回忆一张卡片时，应该先做什么？',back:'先主动回忆，再翻面核对。看着答案点头不等于真正记住。',tags:'示例'},
      {deck:'试用卡组',front:'一张卡片写得太长，怎么处理？',back:'拆成几个能独立回答的小问题。每张卡只考一个清晰的记忆点。',tags:'示例'},
    ];
    const uid=()=>`${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`;
    const dayKey=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
    const today=()=>dayKey(new Date());
    const addDays=(n)=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return dayKey(d)};
    const esc=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const initial=()=>({decks:['试用卡组'],cards:samples.map(c=>({id:uid(),...c,interval:0,ease:2.5,reps:0,due:today(),created:Date.now()})),reviews:{}});
    let canStore=true;
    try{localStorage.setItem(KEY+'-probe','1');localStorage.removeItem(KEY+'-probe')}catch{canStore=false}
    let data;
    try{data=JSON.parse(localStorage.getItem(KEY)||'null')}catch{data=null}
    if(!data||!Array.isArray(data.decks)||!Array.isArray(data.cards))data=initial();
    data.reviews=data.reviews||{};
    let view='home',filterDeck='',queue=[],current=null,revealed=false,relatedOpen=false,noticeTimer,sessionTotal=0,sessionDone=0,cardQuery='',cardDeckFilter='',cardPage=0,editingCardId='';
    const expandedSubjects=new Set(['马原','史纲']),expandedTopics=new Set(),expandedPoints=new Set();
    const $=(s)=>document.querySelector(s), content=$('#content');
    const save=()=>{if(!canStore){toast('此打开方式无法保存浏览器数据，请改用局域网网址或定期导出备份。');return false}try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch{toast('保存失败：浏览器存储空间可能已满，请先导出备份。');return false}};
    function migrateMarkjiDecks(){const marker=KEY+'-split-decks-v1';try{if(localStorage.getItem(marker)==='1')return}catch{return}let changed=false;for(const card of data.cards){if(!MARKJI_SUBJECTS.includes(card.deck))continue;const tags=String(card.tags||'');const group=tags.includes('知识点')?'知识点':(tags.includes('单选')||tags.includes('多选'))?'选择题':'';if(group){card.deck+=`·${group}`;changed=true}}if(changed){const decks=new Set(data.decks.filter(deck=>!MARKJI_SUBJECTS.includes(deck)));data.cards.forEach(card=>decks.add(card.deck));data.decks=[...decks];if(!save())return}try{localStorage.setItem(marker,'1')}catch{}}
    migrateMarkjiDecks();
    function toast(message){const n=$('#notice');n.textContent=message;n.classList.remove('hidden');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>n.classList.add('hidden'),2800)}
    function dueCards(deck=''){return data.cards.filter(c=>(!deck||c.deck===deck)&&(!c.due||c.due<=today()))}
    function showView(next){view=next;filterDeck='';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===(next==='browse'?'decks':next)));if(next==='study'&&current)renderStudy();else render()}
    function pushAppState(state){try{history.pushState(state,'')}catch{}}
    try{history.replaceState({yige:true,view:'home',guard:true},'');history.pushState({yige:true,view:'home',guard:true},'')}catch{}
    addEventListener('popstate',e=>{const state=e.state;if(!state?.yige){pushAppState({yige:true,view:'home',guard:true});showView('home');return}if(view==='study'&&state.view!=='study'){current=null;queue=[];revealed=false}showView(state.view||'home');if(state.guard)pushAppState(state)});
    function setView(next){if(next===view)return;pushAppState({yige:true,view:next});showView(next)}
    function renderHome(){const due=dueCards(),studied=data.reviews[today()]||0;return `${canStore?'':`<div class="empty" role="status">当前浏览器不允许网页存储，复习进度无法自动保留。请在刷新前到「备份」导出 JSON。</div>`}<section class="welcome"><div class="welcome-main"><div><div class="date-line">${new Intl.DateTimeFormat('zh-CN',{dateStyle:'full'}).format(new Date())}</div><h1>把重要的事，<br>记得更久一点。</h1><p>先想一想，再翻开卡片。每日最多复习 30 张，按卡组分批完成。</p></div><button class="primary" data-study="">开始今日复习　·　${Math.min(due.length,DAILY_LIMIT)} 张</button></div><div class="stats"><div class="stat"><span>今日待复习</span><b>${due.length}</b></div><div class="stat"><span>累计卡片</span><b>${data.cards.length}</b></div><div class="stat"><span>今天已复习</span><b>${studied}</b></div><div class="stat"><span>卡组数量</span><b>${data.decks.length}</b></div></div></section><div class="section-head"><div><h2>按卡组复习</h2><p>优先处理已经到期的卡片。</p></div><div><button class="text-button" data-view="browse">按学科浏览 →</button><button class="text-button" data-view="decks">管理卡组 →</button></div></div><div class="deck-list">${data.decks.length?data.decks.map(d=>{const cards=data.cards.filter(c=>c.deck===d),n=dueCards(d).length;return `<button class="deck-row" data-study="${esc(d)}"><span class="deck-copy"><b>${esc(d)}</b><span>${cards.length} 张卡片 · ${n?`${n} 张待复习`:'今天已完成'}</span></span><span class="deck-due">${n}</span><span class="arrow" aria-hidden="true">›</span></button>`}).join(''):'<div class="empty">还没有卡组。去「添加卡片」创建你的第一张记忆卡。</div>'}</div>`}
    function renderDecks(){return `<div class="page-head"><div><h1 class="page-title">我的卡组</h1><p>按课程、主题或考试科目整理卡片。</p></div><button class="primary" data-view="add">新建卡片</button></div><div class="deck-tools"><button class="secondary" data-new-deck>＋ 新建卡组</button><button class="secondary" data-view="cards">管理单张卡片</button></div><div class="deck-list">${data.decks.map(d=>{const cards=data.cards.filter(c=>c.deck===d),n=dueCards(d).length;return `<article class="deck-manage"><div><b>${esc(d)}</b><small>${cards.length} 张卡片 · ${n} 张到期</small></div><div class="deck-manage-actions"><button class="secondary" data-study="${esc(d)}">复习</button><button class="danger-link" data-delete-deck="${esc(d)}">删除</button></div></article>`}).join('')||'<div class="empty">还没有卡组。新建一张卡片后会自动创建卡组。</div>'}</div>`}
    function markjiKnowledgeCards(){return data.cards.filter(c=>MARKJI_SUBJECTS.includes(String(c.deck||'').split('·')[0])&&String(c.tags||'').includes('知识点'))}
    function questionSource(card){return String(card.tags||'').trim().replace(/^(?:单选|多选)\s*/, '')||'题库'}
    let linkSource=null,questionIndex=[],linkCache=new Map();
    function relatedQuestions(point){if(linkSource!==data.cards){linkSource=data.cards;linkCache=new Map();questionIndex=data.cards.filter(c=>String(c.deck||'').endsWith('·选择题')).map(card=>({card,subject:String(card.deck).split('·')[0],text:`${card.front||''} ${card.back||''}`.replace(/[\s\p{P}\p{S}]/gu,'')}))}if(linkCache.has(point.id))return linkCache.get(point.id);const subject=String(point.deck||'').split('·')[0],title=String(point.front||'').trim(),normalized=title.replace(/[\s\p{P}\p{S}]/gu,''),terms=new Set();if(normalized.length>=3)terms.add(normalized);for(const run of title.match(/[\u4e00-\u9fffA-Za-z0-9]+/g)||[]){if(run.length<=10&&run.length>=3)terms.add(run);for(let size=4;size<=Math.min(8,run.length);size++)for(let i=0;i<=run.length-size;i++)terms.add(run.slice(i,i+size))}const matches=questionIndex.map(q=>{let score=0;for(const term of terms)if(q.text.includes(term)&&((q.subject===subject&&term.length>=4)||(q.subject==='未分科'&&term.length>=6)))score=Math.max(score,term.length);return {card:q.card,score}}).filter(x=>x.score>=4).sort((a,b)=>b.score-a.score).map(x=>x.card);linkCache.set(point.id,matches);return matches}
    function renderBrowse(){const cards=markjiKnowledgeCards(),sequence=new Map(cards.map((card,index)=>[card.id,index+1])),subjects=MARKJI_SUBJECTS.map(subject=>{const group=cards.filter(c=>String(c.deck).split('·')[0]===subject);if(!group.length)return '';const topics=new Map();group.forEach(card=>{const name=String(card.tags||'').replace(/^.*?知识点\s*/, '').trim()||'其他';topics.set(name,[...(topics.get(name)||[]),card])});const expanded=expandedSubjects.has(subject);return `<section class="browse-subject ${expanded?'expanded active':''}"><button class="browse-subject-head" data-toggle-subject="${esc(subject)}" aria-expanded="${expanded}"><strong>${esc(subject)}</strong><span class="browse-subject-count">${group.length}</span><i class="browse-caret" aria-hidden="true"></i></button>${expanded?`<div class="browse-topics">${[...topics.entries()].map(([name,items])=>{const topicKey=`${subject}::${name}`,topicExpanded=expandedTopics.has(topicKey),links=new Set(items.flatMap(card=>relatedQuestions(card).map(q=>q.id)));return `<section class="browse-topic-group"><button class="browse-topic" data-toggle-topic="${esc(topicKey)}" aria-expanded="${topicExpanded}"><span>${esc(name)}</span><span>${items.length}${links.size?` · ${links.size} 题`:''}</span></button>${topicExpanded?`<div class="browse-points">${items.map(card=>{const key=card.id,pointExpanded=expandedPoints.has(key),related=relatedQuestions(card);return `<article class="browse-point"><div class="browse-point-row"><button class="browse-point-title" data-study-card="${esc(card.id)}"><small>${sequence.get(card.id)}</small>${esc(card.front)}</button><button class="browse-related-toggle" data-toggle-point="${esc(key)}" aria-expanded="${pointExpanded}">关联题目 ${related.length}</button></div>${pointExpanded?`<div class="browse-related-list">${related.slice(0,8).map(q=>`<button class="browse-related-question" data-study-card="${esc(q.id)}"><span class="browse-question-heading"><span class="question-source">${esc(questionSource     function renderCards(){const filtered=data.cards.filter(c=>(!cardDeckFilter||c.deck===cardDeckFilter)&&(!cardQuery||`${c.front} ${c.back} ${c.tags} ${c.deck}`.toLowerCase().includes(cardQuery.toLowerCase())));const pageSize=40,pageCount=Math.max(1,Math.ceil(filtered.length/pageSize));cardPage=Math.min(cardPage,pageCount-1);const pageCards=filtered.slice(cardPage*pageSize,(cardPage+1)*pageSize);return `<div class="page-head"><div><h1 class="page-title">卡片管理</h1><p>搜索、编辑或删除单张卡片；修改内容会保留复习进度。</p></div><button class="primary" data-new-card>添加卡片</button></div><form id="cardSearchForm" class="card-filter"><input name="query" type="search" value="${esc(cardQuery)}" placeholder="搜索题目、答案或标签"><select name="deck"><option value="">所有卡组</option>${data.decks.map(d=>`<option value="${esc(d)}" ${d===cardDeckFilter?'selected':''}>${esc(d)}</option>`).join('')}</select><button class="secondary">搜索</button></form><p class="hint">${filtered.length} 张卡片 · 第 ${cardPage+1} / ${pageCount} 页，每页 ${pageSize} 张</p><div class="card-admin-list">${pageCards.map(c=>`<article class="card-admin-row"><div><h3>${esc(c.front)}</h3><p>${esc(c.back.slice(0,240))}${c.back.length>240?'…':''}</p><small>${esc(c.deck)}${c.tags?` · ${esc(c.tags)}`:''}</small></div><div class="card-admin-actions"><button class="secondary" data-edit-card="${esc(c.id)}">编辑</button><button class="danger-link" data-delete-card="${esc(c.id)}">删除</button></div></article>`).join('')||'<div class="empty">没有符合条件的卡片。</div>'}</div><div class="deck-tools"><button class="secondary" data-card-page="${Math.max(0,cardPage-1)}" ${cardPage===0?'disabled':''}>上一页</button><button class="secondary" data-card-page="${Math.min(pageCount-1,cardPage+1)}" ${cardPage>=pageCount-1?'disabled':''}>下一页</button></div>`}
    function renderAdd(){const editing=data.cards.find(c=>c.id===editingCardId);return `<div class="page-head"><div><h1 class="page-title">${editing?'编辑记忆卡':'添加记忆卡'}</h1><p>正面写一个问题，背面放答案或提示。内容保存在这台设备的浏览器中。</p></div>${editing?'<button class="secondary" data-cancel-edit>取消编辑</button>':''}</div><form id="cardForm" class="form-panel"><label class="field"><span>卡组</span><input name="deck" list="deckOptions" value="${esc(editing?.deck||data.decks[0]||'新卡组')}" required maxlength="80" placeholder="例如：英语词汇"><datalist id="deckOptions">${data.decks.map(d=>`<option value="${esc(d)}">`).join('')}</datalist></label><label class="field"><span>正面 · 问题</span><textarea name="front" required maxlength="5000" placeholder="写下你想主动回忆的问题">${esc(editing?.front||'')}</textarea></label><label class="field"><span>背面 · 答案</span><textarea name="back" required maxlength="8000" placeholder="写下答案、解释或记忆提示">${esc(editing?.back||'')}</textarea></label><label class="field"><span>标签（可选）</span><input name="tags" value="${esc(editing?.tags||'')}" maxlength="120" placeholder="例如：高数、易混淆"></label><div class="form-actions"><button class="primary">${editing?'保存修改':'保存卡片'}</button><span class="hint">${editing?'修改后会保留这张卡的复习进度。':'提示：一张卡只记一个知识点，复习效果更好。'}</span></div></form>`}
    function renderBackup(){let markjiLoaded=false;try{markjiLoaded=localStorage.getItem(KEY+'-markji-loaded')==='1'}catch{}return `<div class="page-head"><div><h1 class="page-title">数据与备份</h1><p>卡片和复习进度保存在此设备的当前浏览器，可用备份文件迁移。</p></div></div><section class="form-panel"><h2 style="margin:0 0 8px;font:500 21px Georgia,serif">完整备份</h2><p class="hint">JSON 包含卡组、卡片和复习进度；换设备时用它恢复。</p><div class="deck-tools"><button class="primary" data-export-json>导出 JSON 备份</button><label class="file-label">导入 JSON 备份<input id="importJsonFile" type="file"></label></div><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><h2 style="margin:0 0 8px;font:500 21px Georgia,serif">导入或导出卡片</h2><p class="hint">CSV 支持「正面、背面、卡组、标签」四列。导入会追加卡片。</p><div class="deck-tools"><button class="secondary" data-export-csv>导出卡片 CSV</button><button class="secondary" data-load-markji ${markjiLoaded?'disabled':''}>${markjiLoaded?'马克记牌组已载入':'从网站载入马克记牌组'}</button><label class="file-label">选择 CSV 文件<input id="csvImportFile" type="file"></label></div><p class="hint">手动导入请选未压缩的 CSV/TXT 文件；如果 CSV 在 ZIP 里，先在「文件」App 中解压。载入马克记题库可直接点「从网站载入」，不需要选文件。</p><p id="importStatus" class="hint" role="status">${markjiLoaded?'马克记题库已在此浏览器载入。':`「从网站载入」会读取 ${MARKJI_TOTAL} 张卡片并加入当前数据。首次使用需要联网。`}</p><p class="hint">Anki 的 .apkg 牌组包和 AnkiWeb 同步目前不支持。管理单张卡片请使用「卡片」页。</p></section><section class="section-head"><div><h2>清空本机数据</h2><p>删除当前浏览器中的所有卡组、卡片与复习进度。</p></div><button class="danger-link" data-clear>清空数据</button></section>`}
    function render(){const html=view==='home'?renderHome():view==='decks'?renderDecks():view==='browse'?renderBrowse():view==='cards'?renderCards():view==='add'?renderAdd():view==='backup'?renderBackup():'';content.innerHTML=html}
    function startStudy(deck='',selectedId='',tag=''){filterDeck=deck;const matches=c=>(!deck||c.deck===deck)&&(!tag||String(c.tags||'').includes(tag));queue=selectedId?[selectedId]:dueCards(deck).filter(c=>matches(c)).sort((a,b)=>(a.reps||0)-(b.reps||0)||String(a.due||'').localeCompare(String(b.due||''))).slice(0,DAILY_LIMIT).map(c=>c.id);if(!queue.length){const all=data.cards.filter(matches);if(all.length){if(confirm('这个范围今天没有到期卡片。要提前复习最多 30 张卡片吗？'))queue=all.sort((a,b)=>(a.reps||0)-(b.reps||0)).slice(0,DAILY_LIMIT).map(c=>c.id)}else{toast('这个范围还没有卡片。');return}}if(!queue.length){view='home';render();return}sessionTotal=queue.length;sessionDone=0;pushAppState({yige:true,view:'study'});view='study';showNext()}

    function renderStudy(){const index=sessionDone+1,total=Math.max(sessionTotal,1),isKnowledge=String(current.tags||'').includes('知识点'),related=isKnowledge?relatedQuestions(current):[];content.innerHTML=`<div class="review-top"><button class="text-button" data-exit>‹ 结束复习</button><span>${esc(current.deck)}　·　${index} / ${total}</span></div><div class="progress"><i style="width:${Math.min(100,(index/total)*100)}%"></i></div><button class="flashcard ${revealed?'back':''}" data-flip aria-label="${revealed?'显示问题':'翻开查看答案'}"><small>${revealed?'答案':'回忆一下'}</small><span>${esc(revealed?current.back:current.front)}</span>${current.tags?`<small>${esc(current.tags)}</small>`:''}</button>${revealed?`<div class="ratings" aria-label="评价记忆情况"><button class="rating again" data-grade="again"><b>忘了</b><span>1 天后</span></button><button class="rating" data-grade="hard"><b>困难</b><span>${intervalLabel(nextInterval(current,'hard'))}</span></button><button class="rating good" data-grade="good"><b>记住</b><span>${intervalLabel(nextInterval(current,'good'))}</span></button><button class="rating" data-grade="easy"><b>简单</b><span>${intervalLabel(nextInterval(current,'easy'))}</span></button></div>`:'<p class="reveal-hint">点卡片翻面　·　也可以按空格键</p>'}${isKnowledge?`<section class="study-related"><button class="study-related-toggle" data-study-related aria-expanded="${relatedOpen}"><span>关联题目 <b>${related.length}</b></span><span class="study-related-chevron" aria-hidden="true">${relatedOpen?'收起':'展开'}</span></button>${relatedOpen?`<div class="study-related-list">${related.slice(0,8).map(q=>`<details class="study-question"><summary><span class="question-source">${esc(questionSource(q))}</span><span>${esc(q.front)}</span></summary><p>${esc(q.back)}</p></details>`).join('')||'<p class="hint">暂未匹配到关联题目，可以在「按学科浏览」中展开分类检查。</p>'}${related.length>8?'<p class="hint">显示标题匹配度较高的前 8 道题。</p>':''}</div>`:''}</section>`:''}`}
    function nextInterval(c,grade){if(grade==='again')return 1;const previous=Math.max(0,Number(c.interval)||0),ease=Math.max(1.3,Number(c.ease)||2.5);if(grade==='hard')return previous?Math.max(1,Math.round(previous*1.2)):2;if(grade==='easy')return previous?Math.max(4,Math.round(previous*(ease+.3))):7;return previous?Math.max(2,Math.round(previous*ease)):3}
    function intervalLabel(days){return days===1?'1 天后':`${days} 天后`}
    function gradeCard(grade){if(!current)return;const days=nextInterval(current,grade);current.interval=days;current.due=addDays(days);current.ease=Math.max(1.3,(Number(current.ease)||2.5)+(grade==='easy'?.15:grade==='hard'?-.15:grade==='again'?-.2:0));current.reps=grade==='again'?0:(current.reps||0)+1;current.lastReviewed=today();data.reviews[today()]=(data.reviews[today()]||0)+1;save();sessionDone++;queue.shift();if(queue.length)showNext();else{current=null;history.back();toast('这一轮完成，复习进度已保存。')}}

    function deleteCard(id){const index=data.cards.findIndex(c=>c.id===id);if(index<0)return;const card=data.cards[index];if(!confirm(`删除这张卡片？\n\n${card.front.slice(0,100)}`))return;const previous=data,next={...data,decks:[...data.decks],cards:data.cards.filter(c=>c.id!==id),reviews:{...data.reviews}};data=next;if(!save()){data=previous;return}const remaining=data.cards.filter(c=>(!cardDeckFilter||c.deck===cardDeckFilter)&&(!cardQuery||`${c.front} ${c.back} ${c.tags} ${c.deck}`.toLowerCase().includes(cardQuery.toLowerCase()))).length;cardPage=Math.min(cardPage,Math.max(0,Math.ceil(remaining/40)-1));render();toast('卡片已删除。')}
    function deleteDeck(name){const count=data.cards.filter(c=>c.deck===name).length;if(!confirm(`删除「${name}」和其中 ${count} 张卡片？此操作无法撤销。`))return;data.decks=data.decks.filter(d=>d!==name);data.cards=data.cards.filter(c=>c.deck!==name);if(!data.decks.length)data.decks=['默认卡组'];save();render();toast('卡组已删除。')}

    function exportCSV(){const rows=[['正面','背面','卡组','标签'],...data.cards.map(c=>[c.front,c.back,c.deck,c.tags])];download(`忆格卡片_${today()}.csv`,new Blob(['\ufeff'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));toast('CSV 文件已生成。')}
    function parseDelimited(text){const source=text.replace(/^\ufeff/,''),directive=source.match(/^#separator:(.+)$/m)?.[1]?.trim(),clean=source.split(/\r?\n/).filter(line=>!line.startsWith('#')).join('\n'),first=clean.split(/\r?\n/,1)[0]||'',sep=directive==='tab'||first.includes('\t')?'\t':',';let rows=[],row=[],cell='',quoted=false;for(let i=0;i<clean.length;i++){const c=clean[i];if(quoted){if(c==='"'&&clean[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===sep){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell.replace(/\r$/,''));rows.push(row)}return rows.filter(r=>r.some(v=>v.trim()))}
    function importRows(rows,replaceTrial=false){if(!rows.length)throw Error('文件里没有卡片');const headers=rows[0].map(x=>x.trim().toLowerCase().replace(/^\ufeff/,'')),hasHeader=headers.some(x=>['正面','front','question','问题'].includes(x)),frontIndex=hasHeader?headers.findIndex(x=>['正面','front','question','问题'].includes(x)):0,backIndex=hasHeader?headers.findIndex(x=>['背面','back','answer','答案'].includes(x)):1,deckIndex=hasHeader?headers.findIndex(x=>['卡组','deck'].includes(x)):2,tagsIndex=hasHeader?headers.findIndex(x=>['标签','tags','tag'].includes(x)):-1;const incoming=rows.slice(hasHeader?1:0).map(r=>({front:(r[frontIndex]||'').trim(),back:(r[backIndex]||'').trim(),deck:(deckIndex>=0?(r[deckIndex]||'').trim():'')||data.decks[0]||'默认卡组',tags:tagsIndex>=0?(r[tagsIndex]||'').trim():''})).filter(c=>c.front&&c.back);if(!incoming.length)throw Error('没有读到正面和背面都有内容的卡片');const previous=data,next={decks:[...data.decks],cards:[...data.cards],reviews:{...data.reviews}},isPristineTrial=next.cards.length===samples.length&&next.cards.every((card,index)=>card.deck==='试用卡组'&&card.front===samples[index].front);if(replaceTrial&&isPristineTrial){next.decks=next.decks.filter(deck=>deck!=='试用卡组');next.cards=[]}for(const c of incoming){if(!next.decks.includes(c.deck))next.decks.push(c.deck);next.cards.push({id:uid(),...c,interval:0,ease:2.5,reps:0,due:today(),created:Date.now()})}data=next;if(!save()){data=previous;throw Error('浏览器没有保存导入结果。请先导出备份，并检查浏览器存储空间。')}return incoming.length}
    async function loadBundledCards(){const marker=KEY+'-markji-loaded',button=$('[data-load-markji]'),status=$('#importStatus');try{if(location.protocol==='file:')throw Error('本地 HTML 无法自动读取同目录 CSV。请点“选择 CSV 文件”，再选 markji_cards.csv。');if(!canStore)throw Error('当前浏览器不允许保存数据，无法导入。请在 Chrome 中打开 HTTPS 网站。');if(localStorage.getItem(marker)==='1'){if(status)status.textContent='这组马克记卡片已经载入过；无需重复导入。';if(button){button.disabled=true;button.textContent='马克记牌组已载入'}return}if(button){button.disabled=true;button.textContent='正在下载题库…'}if(status)status.textContent='正在从忆格网站下载题库，请稍候…';const response=await fetch(new URL('markji_cards.csv',document.baseURI),{cache:'no-store'});if(!response.ok)throw Error(`题库下载失败（HTTP ${response.status}）。请刷新网页后重试。`);const type=response.headers.get('content-type')||'';if(type.includes('text/html'))throw Error('网站返回的不是 CSV 文件。请刷新网页后重试。');const csv=await response.text();if(button)button.textContent='正在导入并保存…';if(status)status.textContent=`文件已下载（${(csv.length/1024/1024).toFixed(1)} MB），正在解析并保存 ${MARKJI_TOTAL} 张卡片…`;const count=importRows(parseDelimited(csv.replace(/^\ufeff/,'')),true);try{localStorage.setItem(marker,'1')}catch{}if(status)status.textContent=`载入完成：${count} 张卡片。题库已保存在此浏览器。`;if(button){button.disabled=true;button.textContent='马克记牌组已载入'}toast(`已载入 ${count} 张马克记卡片。`)}catch(e){if(button){button.disabled=false;button.textContent='重试载入马克记牌组'}if(status)status.textContent=e.message||'载入失败，请检查网络后重试。';toast(e.message||'载入马克记牌组失败。')}}
    async function importFile(file,kind){if(!file)return;try{if(kind==='json'&&!/\.json$/i.test(file.name))throw Error('请选择 JSON 备份文件。');if(kind==='csv'&&!/\.(csv|txt)$/i.test(file.name))throw Error('请选择 CSV 或 TXT 文件。');if(kind==='json'){const backup=JSON.parse(await file.text());if(!Array.isArray(backup.cards)||!Array.isArray(backup.decks))throw Error('这不是忆格备份文件');if(!confirm(`导入 ${backup.cards.length} 张卡片并替换本机数据？`))return;data={decks:backup.decks,cards:backup.cards,reviews:backup.reviews||{}};save();toast('备份已恢复。')}else{const count=importRows(parseDelimited((await file.text()).replace(/^\ufeff/,'')));toast(`已导入 ${count} 张卡片。`)}setView('home')}catch(e){toast(e.message||'无法读取这个文件。')}finally{const input=kind==='json'?$('#importJsonFile'):$('#csvImportFile');if(input)input.value=''}}
    function clearData(){if(!confirm('清空这台设备浏览器中的全部卡组、卡片和复习记录？请先导出备份。'))return;data={decks:[],cards:[],reviews:{}};save();try{localStorage.removeItem(KEY+'-markji-loaded')}catch{}setView('home');toast('本机数据已清空。')}
    document.addEventListener('click',e=>{const b=e.target.closest('button,[data-view]');if(!b)return;if(b.dataset.view){if(b.dataset.view==='add'&&view!=='add')editingCardId='';setView(b.dataset.view);return}if(b.hasAttribute('data-study-related')){relatedOpen=!relatedOpen;renderStudy();return}if(b.dataset.toggleSubject){const key=b.dataset.toggleSubject;expandedSubjects.has(key)?expandedSubjects.delete(key):expandedSubjects.add(key);render();return}if(b.dataset.toggleTopic){const key=b.dataset.toggleTopic;expandedTopics.has(key)?expandedTopics.delete(key):expandedTopics.add(key);render();return}if(b.dataset.togglePoint){const key=b.dataset.togglePoint;expandedPoints.has(key)?expandedPoints.delete(key):expandedPoints.add(key);render();return}if(b.dataset.studyCard){startStudy('',b.dataset.studyCard);return}if(b.dataset.study!==undefined){startStudy(b.dataset.study,'',b.dataset.studyTag||'');return}if(b.dataset.flip!==undefined){revealed=!revealed;renderStudy();return}if(b.dataset.grade){gradeCard(b.dataset.grade);return}if(b.hasAttribute('data-exit')){history.back();return}if(b.hasAttribute('data-new-card')){editingCardId='';setView('add');return}if(b.dataset.editCard){editingCardId=b.dataset.editCard;setView('add');return}if(b.dataset.deleteCard){deleteCard(b.dataset.deleteCard);return}if(b.hasAttribute('data-cancel-edit')){editingCardId='';history.back();return}if(b.dataset.cardPage!==undefined){cardPage=Number(b.dataset.cardPage)||0;render();return}if(b.hasAttribute('data-new-deck')){askDeck();return}if(b.dataset.deleteDeck){deleteDeck(b.dataset.deleteDeck);return}if(b.hasAttribute('data-export-json')){exportJSON();return}if(b.hasAttribute('data-export-csv')){exportCSV();return}if(b.hasAttribute('data-clear')){clearData();return}if(b.hasAttribute('data-load-markji')){loadBundledCards();return}if(b.hasAttribute('data-import-json')){$('#importFile').accept='.json,application/json';$('#importFile').dataset.kind='json';$('#importFile').click();return}if(b.hasAttribute('data-import-csv')){$('#importFile').accept='.csv,.txt,text/csv,text/plain';$('#importFile').dataset.kind='csv';$('#importFile').click()}});
    document.addEventListener('change',e=>{if(e.target.id==='csvImportFile')importFile(e.target.files?.[0],'csv');else if(e.target.id==='importJsonFile')importFile(e.target.files?.[0],'json')});
    content.addEventListener('submit',e=>{if(e.target.id==='cardNumberForm'){e.preventDefault();const number=Number(new FormData(e.target).get('number')),cards=markjiKnowledgeCards();if(!Number.isInteger(number)||number<1||number>cards.length){toast(`请输入 1 到 ${cards.length} 之间的序号。`);return}startStudy('',cards[number-1].id);return}if(e.target.id==='cardSearchForm'){e.preventDefault();const form=new FormData(e.target);cardQuery=String(form.get('query')||'').trim();cardDeckFilter=String(form.get('deck')||'');cardPage=0;render();return}if(e.target.id!=='cardForm')return;e.preventDefault();const form=new FormData(e.target),deck=String(form.get('deck')).trim()||'默认卡组',front=String(form.get('front')).trim(),back=String(form.get('back')).trim(),tags=String(form.get('tags')||'').trim();if(!front||!back)return;const previous=data,next={...data,decks:[...data.decks],cards:[...data.cards],reviews:{...data.reviews}};if(!next.decks.includes(deck))next.decks.push(deck);if(editingCardId){const index=next.cards.findIndex(c=>c.id===editingCardId);if(index<0){toast('找不到要编辑的卡片。');return}next.cards[index]={...next.cards[index],deck,front,back,tags};data=next;if(!save()){data=previous;return}editingCardId='';history.back();toast('卡片已更新，复习进度已保留。');return}next.cards.push({id:uid(),deck,front,back,tags,interval:0,ease:2.5,reps:0,due:today(),created:Date.now()});data=next;if(!save()){data=previous;return}setView('home');toast('卡片已添加，今天就可以开始复习。')});
    document.addEventListener('keydown',e=>{if(view!=='study')return;if(e.code==='Space'){e.preventDefault();if(!revealed){revealed=true;renderStudy()}}else if(revealed&&['1','2','3','4'].includes(e.key))gradeCard(({1:'again',2:'hard',3:'good',4:'easy'})[e.key])});
    save();render();
  })();
  </script>
