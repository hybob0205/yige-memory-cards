<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f2ea">
  <title>忆格 · 间隔记忆卡</title>
  <style>
    :root{color-scheme:light;--paper:#f4f2ea;--surface:#fffcf4;--ink:#183229;--muted:#637268;--line:#d8d9c9;--forest:#173f32;--green:#245c43;--sage:#e7eee5;--clay:#b7654d;--shadow:0 12px 34px #173f3214;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--paper);color:var(--ink);font-synthesis:none;text-rendering:optimizeLegibility}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:var(--paper)}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #78a98b;outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.48}.shell{width:min(1180px,100%);margin:auto;padding:clamp(18px,4vw,48px) clamp(16px,4vw,42px) max(30px,env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:34px}.brand{display:flex;align-items:center;gap:12px;border:0;background:none;text-align:left;padding:0}.brand-icon{width:42px;height:42px;display:grid;place-items:center;background:var(--forest);color:var(--surface);border-radius:14px;font-family:Georgia,serif;font-size:23px}.brand strong{display:block;font:600 20px/1.2 Georgia,"Songti SC",serif;letter-spacing:.01em}.brand small{display:block;color:var(--muted);font-size:12px;margin-top:4px}.nav{display:flex;gap:5px;padding:4px;background:#eae9df;border-radius:13px}.nav button{border:0;background:transparent;border-radius:10px;padding:10px 14px;color:#57655a;min-height:44px}.nav button.active{background:var(--surface);color:var(--forest);box-shadow:0 2px 6px #173f3212}.content{min-height:60vh}.welcome{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;align-items:stretch}.welcome-main{padding:clamp(24px,5vw,52px);background:var(--forest);color:#fffcf4;border-radius:18px;display:flex;flex-direction:column;justify-content:space-between;min-height:275px}.welcome-main h1{max-width:560px;font:500 clamp(30px,5vw,52px)/1.16 Georgia,"Songti SC",serif;letter-spacing:-.025em;margin:16px 0}.welcome-main p{margin:0;max-width:480px;color:#d5e0d4;line-height:1.7}.date-line{font-size:13px;color:#d5e0d4}.primary{border:0;border-radius:10px;background:var(--forest);color:#fffef6;font-weight:600;padding:13px 18px;min-height:48px}.welcome-main .primary{align-self:flex-start;background:#f1efdf;color:var(--forest);margin-top:24px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{padding:22px;border:1px solid var(--line);border-radius:15px;background:var(--surface);display:flex;flex-direction:column;justify-content:space-between;min-height:130px}.stat span{font-size:13px;color:var(--muted)}.stat b{font:500 40px/1 Georgia,serif;font-variant-numeric:tabular-nums}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:36px 0 14px}.section-head h2,.page-title{font:500 26px/1.2 Georgia,"Songti SC",serif;margin:0}.section-head p{margin:5px 0 0;color:var(--muted);font-size:13px}.text-button{border:0;background:transparent;color:var(--green);padding:10px 0;font-weight:600}.deck-list{display:grid;gap:10px}.deck-row{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:20px;text-align:left;border:1px solid var(--line);border-radius:14px;padding:18px 20px;background:var(--surface);min-height:82px}.deck-row:hover{border-color:#aebda8}.deck-copy b{display:block;font-size:16px;font-weight:600}.deck-copy span{display:block;color:var(--muted);font-size:12px;margin-top:5px}.deck-due{font:500 23px Georgia,serif;color:var(--green);min-width:42px;text-align:right}.arrow{font-size:22px;color:#95a091}.empty{padding:32px 18px;text-align:center;border:1px dashed #bcc6b5;border-radius:14px;color:var(--muted);line-height:1.7}.page-head{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:22px}.page-head p{margin:7px 0 0;color:var(--muted);font-size:14px;line-height:1.6}.deck-tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.secondary{min-height:46px;padding:10px 15px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--forest);font-weight:600}.deck-manage{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}.deck-manage b{font-size:16px}.deck-manage small{display:block;color:var(--muted);margin-top:5px}.deck-manage-actions{display:flex;align-items:center;gap:12px}.danger-link{border:0;background:transparent;color:#a34c3b;padding:10px}.form-panel{max-width:760px;padding:clamp(20px,4vw,34px);border:1px solid var(--line);border-radius:16px;background:var(--surface)}.field{display:grid;gap:8px;margin:0 0 18px}.field span{font-size:13px;font-weight:600}.field input,.field textarea,.field select{width:100%;min-height:48px;border:1px solid var(--line);border-radius:10px;background:#fffef9;padding:12px 14px;color:var(--ink)}.field textarea{min-height:140px;resize:vertical;line-height:1.65}.form-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.hint{color:var(--muted);font-size:12px;line-height:1.6}.review-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;color:var(--muted);font-size:13px}.progress{height:5px;background:#e1e3d8;border-radius:4px;overflow:hidden;margin:0 0 18px}.progress i{display:block;height:100%;background:#5e8b69;transition:width .25s}.flashcard{width:100%;min-height:min(48vh,440px);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px;text-align:center;padding:clamp(25px,7vw,64px);border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:var(--shadow);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.72;font:500 clamp(24px,4vw,38px)/1.5 Georgia,"Songti SC","PingFang SC",serif}.flashcard small{font:600 11px/1.4 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;letter-spacing:.12em;color:#718175;text-transform:uppercase}.flashcard.back{min-height:min(48vh,440px);font-size:clamp(20px,3.3vw,30px);background:#f8f6ec}.reveal-hint{margin:12px 0 0;text-align:center;color:var(--muted);font-size:13px}.ratings{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}.rating{min-height:68px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.rating b{font-size:15px}.rating span{font-size:11px;color:var(--muted)}.rating.again{color:#a34c3b}.rating.good{background:var(--forest);color:#fffef6;border-color:var(--forest)}.rating.good span{color:#d5e0d4}.review-empty{max-width:660px;margin:8vh auto;padding:clamp(26px,6vw,56px);background:var(--surface);border:1px solid var(--line);border-radius:18px;text-align:center}.review-empty h2{font:500 30px Georgia,"Songti SC",serif;margin:0 0 10px}.review-empty p{color:var(--muted);line-height:1.7;margin:0 0 20px}.file-label{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:10px 15px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--forest);font-weight:600;cursor:pointer}.file-label{position:relative;overflow:hidden}.file-label input{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:auto;cursor:pointer}.notice{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:12px 17px;border-radius:10px;background:var(--forest);color:white;box-shadow:var(--shadow);z-index:10;max-width:calc(100vw - 30px);font-size:13px}.footer{margin-top:42px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.7}.hidden{display:none!important}dialog{max-width:min(520px,calc(100% - 28px));border:1px solid var(--line);border-radius:16px;padding:25px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}dialog::backdrop{background:#132a2080}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
    @media(max-width:720px){.shell{padding:18px 16px max(24px,env(safe-area-inset-bottom))}.top{align-items:flex-start;flex-direction:column;margin-bottom:25px;gap:18px}.nav{width:100%;display:grid;grid-template-columns:repeat(4,1fr)}.nav button{padding:8px 5px;font-size:13px}.welcome{grid-template-columns:1fr;gap:10px}.welcome-main{min-height:250px;padding:25px}.welcome-main h1{font-size:34px}.stats{gap:8px}.stat{min-height:100px;padding:15px}.stat b{font-size:32px}.section-head{margin-top:28px}.deck-row{gap:10px;padding:15px 13px}.deck-copy b{font-size:14px}.deck-due{font-size:20px}.page-head{align-items:flex-start;flex-direction:column}.deck-manage{padding:15px;gap:8px}.deck-manage-actions{gap:4px}.danger-link{padding:8px 4px;font-size:12px}.flashcard{min-height:42vh;padding:24px 19px;border-radius:16px}.flashcard.back{min-height:42vh}.ratings{grid-template-columns:repeat(2,1fr);gap:8px}.rating{min-height:58px}.footer{margin-top:30px}}
    @media(min-width:721px) and (max-width:980px){.shell{padding-inline:28px}.welcome-main{min-height:255px}.stat{min-height:120px}}
    @media(max-height:560px) and (orientation:landscape){.shell{padding-top:12px}.top{margin-bottom:16px}.welcome-main{min-height:210px}.flashcard,.flashcard.back{min-height:34vh}.review-top{margin-bottom:8px}.ratings{margin-top:12px}.rating{min-height:54px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <button class="brand" data-view="home" aria-label="返回忆格首页"><span class="brand-icon" aria-hidden="true">忆</span><span><strong>忆格</strong><small>间隔记忆卡 · 离线学习</small></span></button>
      <nav class="nav" aria-label="主导航"><button data-view="home" class="active">今日</button><button data-view="decks">卡组</button><button data-view="add">添加卡片</button><button data-view="backup">备份</button></nav>
    </header>
    <main id="content" class="content" tabindex="-1"></main>
    <footer class="footer">卡片和复习记录只保存在当前浏览器。记得定期导出备份，换设备时再导入。<br>忆格是独立的学习网页，复习灵感来自 Anki；不连接 AnkiWeb。</footer>
  </div>
  <div id="notice" class="notice hidden" role="status" aria-live="polite"></div>
  <input id="importFile" type="file" accept=".json,.csv,.txt,text/csv,text/plain,application/json" class="hidden">
  <script>
  (()=>{
    const KEY='yige-ipad-v1';
    const DAILY_LIMIT=30;
    const samples=[
      {deck:'试用卡组',front:'间隔重复的核心是什么？',back:'在记忆即将变淡时再次回忆，让每次复习都发生在更合适的时间。',tags:'示例'},
      {deck:'试用卡组',front:'回忆一张卡片时，应该先做什么？',back:'先主动回忆，再翻面核对。看着答案点头不等于真正记住。',tags:'示例'},
      {deck:'试用卡组',front:'一张卡片写得太长，怎么处理？',back:'拆成几个能独立回答的小问题。每张卡只考一个清晰的记忆点。',tags:'示例'},
    ];
    const uid=()=>`${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`;
    const dayKey=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
    const today=()=>dayKey(new Date());
    const addDays=(n)=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return dayKey(d)};
    const esc=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const initial=()=>({decks:['试用卡组'],cards:samples.map(c=>({id:uid(),...c,interval:0,ease:2.5,reps:0,due:today(),created:Date.now()})),reviews:{}});
    let canStore=true;
    try{localStorage.setItem(KEY+'-probe','1');localStorage.removeItem(KEY+'-probe')}catch{canStore=false}
    let data;
    try{data=JSON.parse(localStorage.getItem(KEY)||'null')}catch{data=null}
    if(!data||!Array.isArray(data.decks)||!Array.isArray(data.cards))data=initial();
    data.reviews=data.reviews||{};
    let view='home',filterDeck='',queue=[],current=null,revealed=false,noticeTimer,sessionTotal=0,sessionDone=0;
    const $=(s)=>document.querySelector(s), content=$('#content');
    const save=()=>{if(!canStore){toast('此打开方式无法保存浏览器数据，请改用局域网网址或定期导出备份。');return false}try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch{toast('保存失败：浏览器存储空间可能已满，请先导出备份。');return false}};
    function toast(message){const n=$('#notice');n.textContent=message;n.classList.remove('hidden');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>n.classList.add('hidden'),2800)}
    function dueCards(deck=''){return data.cards.filter(c=>(!deck||c.deck===deck)&&(!c.due||c.due<=today()))}
    function showView(next){view=next;filterDeck='';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===next));if(next==='study'&&current)renderStudy();else render()}
    function pushAppState(state){try{history.pushState(state,'')}catch{}}
    try{history.replaceState({yige:true,view:'home',guard:true},'');history.pushState({yige:true,view:'home',guard:true},'')}catch{}
    addEventListener('popstate',e=>{const state=e.state;if(!state?.yige){pushAppState({yige:true,view:'home',guard:true});showView('home');return}if(view==='study'&&state.view!=='study'){current=null;queue=[];revealed=false}showView(state.view||'home');if(state.guard)pushAppState(state)});
    function setView(next){if(next===view)return;pushAppState({yige:true,view:next});showView(next)}
    function renderHome(){const due=dueCards(),studied=data.reviews[today()]||0;return `${canStore?'':`<div class="empty" role="status">当前浏览器不允许网页存储，复习进度无法自动保留。请在刷新前到「备份」导出 JSON。</div>`}<section class="welcome"><div class="welcome-main"><div><div class="date-line">${new Intl.DateTimeFormat('zh-CN',{dateStyle:'full'}).format(new Date())}</div><h1>把重要的事，<br>记得更久一点。</h1><p>先想一想，再翻开卡片。每日最多复习 30 张，按卡组分批完成。</p></div><button class="primary" data-study="">开始今日复习　·　${Math.min(due.length,DAILY_LIMIT)} 张</button></div><div class="stats"><div class="stat"><span>今日待复习</span><b>${due.length}</b></div><div class="stat"><span>累计卡片</span><b>${data.cards.length}</b></div><div class="stat"><span>今天已复习</span><b>${studied}</b></div><div class="stat"><span>卡组数量</span><b>${data.decks.length}</b></div></div></section><div class="section-head"><div><h2>按卡组复习</h2><p>优先处理已经到期的卡片。</p></div><button class="text-button" data-view="decks">管理卡组 →</button></div><div class="deck-list">${data.decks.length?data.decks.map(d=>{const cards=data.cards.filter(c=>c.deck===d),n=dueCards(d).length;return `<button class="deck-row" data-study="${esc(d)}"><span class="deck-copy"><b>${esc(d)}</b><span>${cards.length} 张卡片 · ${n?`${n} 张待复习`:'今天已完成'}</span></span><span class="deck-due">${n}</span><span class="arrow" aria-hidden="true">›</span></button>`}).join(''):'<div class="empty">还没有卡组。去「添加卡片」创建你的第一张记忆卡。</div>'}</div>`}
    function renderDecks(){return `<div class="page-head"><div><h1 class="page-title">我的卡组</h1><p>按课程、主题或考试科目整理卡片。</p></div><button class="primary" data-view="add">新建卡片</button></div><div class="deck-tools"><button class="secondary" data-new-deck>＋ 新建卡组</button></div><div class="deck-list">${data.decks.map(d=>{const cards=data.cards.filter(c=>c.deck===d),n=dueCards(d).length;return `<article class="deck-manage"><div><b>${esc(d)}</b><small>${cards.length} 张卡片 · ${n} 张到期</small></div><div class="deck-manage-actions"><button class="secondary" data-study="${esc(d)}">复习</button><button class="danger-link" data-delete-deck="${esc(d)}">删除</button></div></article>`}).join('')||'<div class="empty">还没有卡组。新建一张卡片后会自动创建卡组。</div>'}</div>`}
    function renderAdd(){return `<div class="page-head"><div><h1 class="page-title">添加记忆卡</h1><p>正面写一个问题，背面放答案或提示。内容保存在这台设备的浏览器中。</p></div></div><form id="cardForm" class="form-panel"><label class="field"><span>卡组</span><input name="deck" list="deckOptions" value="${esc(data.decks[0]||'新卡组')}" required maxlength="80" placeholder="例如：英语词汇"><datalist id="deckOptions">${data.decks.map(d=>`<option value="${esc(d)}">`).join('')}</datalist></label><label class="field"><span>正面 · 问题</span><textarea name="front" required maxlength="5000" placeholder="写下你想主动回忆的问题"></textarea></label><label class="field"><span>背面 · 答案</span><textarea name="back" required maxlength="8000" placeholder="写下答案、解释或记忆提示"></textarea></label><label class="field"><span>标签（可选）</span><input name="tags" maxlength="120" placeholder="例如：高数、易混淆"></label><div class="form-actions"><button class="primary">保存卡片</button><span class="hint">提示：一张卡只记一个知识点，复习效果更好。</span></div></form>`}
    function renderBackup(){return `<div class="page-head"><div><h1 class="page-title">数据与备份</h1><p>所有内容默认只在此浏览器保存。导出文件可以存到「文件」或通过隔空投送迁移。</p></div></div><section class="form-panel"><h2 style="margin:0 0 8px;font:500 21px Georgia,serif">完整备份</h2><p class="hint">包含卡组、卡片、复习次数和间隔。请在清理浏览器数据前先导出。</p><div class="deck-tools"><button class="primary" data-export-json>导出 JSON 备份</button><button class="secondary" data-import-json>导入 JSON 备份</button></div><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><h2 style="margin:0 0 8px;font:500 21px Georgia,serif">与 Anki 卡片互通</h2><p class="hint">导入 CSV 或制表符文本卡片。支持「正面、背面、卡组、标签」列；没有卡组列时会放入当前卡组。可以导入忆格提供的马克记分享页卡片文件。</p><div class="deck-tools"><button class="secondary" data-export-csv>导出卡片 CSV</button><button class="secondary" data-load-markji>从网站载入马克记牌组</button><label class="file-label">选择 CSV / 文本卡片<input id="csvImportFile" type="file" accept=".csv,.txt,text/csv,text/plain"></label></div><p class="hint">Anki 的 .apkg 牌组包和 AnkiWeb 同步目前不支持。CSV 导入会追加卡片；同一份文件请勿重复导入。</p></section><section class="section-head"><div><h2>清空本机数据</h2><p>删除当前浏览器中的所有卡组、卡片与复习进度。</p></div><button class="danger-link" data-clear>清空数据</button></section>`}
    function render(){const html=view==='home'?renderHome():view==='decks'?renderDecks():view==='add'?renderAdd():view==='backup'?renderBackup():'';content.innerHTML=html}
    function startStudy(deck=''){filterDeck=deck;queue=dueCards(deck).sort((a,b)=>(a.reps||0)-(b.reps||0)||String(a.due||'').localeCompare(String(b.due||''))).slice(0,DAILY_LIMIT).map(c=>c.id);if(!queue.length){const all=data.cards.filter(c=>!deck||c.deck===deck);if(all.length){if(confirm('这个范围今天没有到期卡片。要提前复习最多 30 张卡片吗？'))queue=all.sort((a,b)=>(a.reps||0)-(b.reps||0)).slice(0,DAILY_LIMIT).map(c=>c.id)}else{toast('这个卡组还没有卡片，先添加一张吧。');return}}if(!queue.length){view='home';render();return}sessionTotal=queue.length;sessionDone=0;pushAppState({yige:true,view:'study'});view='study';showNext()}
    function showNext(){current=data.cards.find(c=>c.id===queue[0]);revealed=false;if(!current){view='home';render();return}renderStudy()}
    function renderStudy(){const index=sessionDone+1,total=Math.max(sessionTotal,1);content.innerHTML=`<div class="review-top"><button class="text-button" data-exit>‹ 结束复习</button><span>${esc(current.deck)}　·　${index} / ${total}</span></div><div class="progress"><i style="width:${Math.min(100,(index/total)*100)}%"></i></div><button class="flashcard ${revealed?'back':''}" data-flip aria-label="${revealed?'显示问题':'翻开查看答案'}"><small>${revealed?'答案':'回忆一下'}</small><span>${esc(revealed?current.back:current.front)}</span>${current.tags?`<small>${esc(current.tags)}</small>`:''}</button>${revealed?`<div class="ratings" aria-label="评价记忆情况"><button class="rating again" data-grade="again"><b>忘了</b><span>1 天后</span></button><button class="rating" data-grade="hard"><b>困难</b><span>${intervalLabel(nextInterval(current,'hard'))}</span></button><button class="rating good" data-grade="good"><b>记住</b><span>${intervalLabel(nextInterval(current,'good'))}</span></button><button class="rating" data-grade="easy"><b>简单</b><span>${intervalLabel(nextInterval(current,'easy'))}</span></button></div>`:'<p class="reveal-hint">点卡片翻面　·　也可以按空格键</p>'}`}
    function nextInterval(c,grade){if(grade==='again')return 1;const previous=Math.max(0,Number(c.interval)||0),ease=Math.max(1.3,Number(c.ease)||2.5);if(grade==='hard')return previous?Math.max(1,Math.round(previous*1.2)):2;if(grade==='easy')return previous?Math.max(4,Math.round(previous*(ease+.3))):7;return previous?Math.max(2,Math.round(previous*ease)):3}
    function intervalLabel(days){return days===1?'1 天后':`${days} 天后`}
    function gradeCard(grade){if(!current)return;const days=nextInterval(current,grade);current.interval=days;current.due=addDays(days);current.ease=Math.max(1.3,(Number(current.ease)||2.5)+(grade==='easy'?.15:grade==='hard'?-.15:grade==='again'?-.2:0));current.reps=grade==='again'?0:(current.reps||0)+1;current.lastReviewed=today();data.reviews[today()]=(data.reviews[today()]||0)+1;save();sessionDone++;queue.shift();if(queue.length)showNext();else{current=null;history.back();toast('这一轮完成，复习进度已保存。')}}
    function askDeck(){const name=prompt('新卡组名称');if(!name)return;const clean=name.trim().slice(0,80);if(!clean)return;if(!data.decks.includes(clean))data.decks.push(clean);save();render()}
    function deleteDeck(name){const count=data.cards.filter(c=>c.deck===name).length;if(!confirm(`删除「${name}」和其中 ${count} 张卡片？此操作无法撤销。`))return;data.decks=data.decks.filter(d=>d!==name);data.cards=data.cards.filter(c=>c.deck!==name);if(!data.decks.length)data.decks=['默认卡组'];save();render();toast('卡组已删除。')}
    function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
    function exportJSON(){download(`忆格备份_${today()}.json`,new Blob([JSON.stringify({format:KEY,exportedAt:new Date().toISOString(),...data},null,2)],{type:'application/json'}));toast('备份文件已生成。')}
    const csvCell=s=>`"${String(s??'').replace(/"/g,'""')}"`;
    function exportCSV(){const rows=[['正面','背面','卡组','标签'],...data.cards.map(c=>[c.front,c.back,c.deck,c.tags])];download(`忆格卡片_${today()}.csv`,new Blob(['\ufeff'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));toast('CSV 文件已生成。')}
    function parseDelimited(text){const source=text.replace(/^\ufeff/,''),directive=source.match(/^#separator:(.+)$/m)?.[1]?.trim(),clean=source.split(/\r?\n/).filter(line=>!line.startsWith('#')).join('\n'),first=clean.split(/\r?\n/,1)[0]||'',sep=directive==='tab'||first.includes('\t')?'\t':',';let rows=[],row=[],cell='',quoted=false;for(let i=0;i<clean.length;i++){const c=clean[i];if(quoted){if(c==='"'&&clean[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===sep){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell.replace(/\r$/,''));rows.push(row)}return rows.filter(r=>r.some(v=>v.trim()))}
    function importRows(rows){if(!rows.length)throw Error('文件里没有卡片');let headers=rows[0].map(x=>x.trim().toLowerCase()),hasHeader=headers.some(x=>['正面','front','question','问题'].includes(x));let frontIndex=hasHeader?headers.findIndex(x=>['正面','front','question','问题'].includes(x)):0,backIndex=hasHeader?headers.findIndex(x=>['背面','back','answer','答案'].includes(x)):1,deckIndex=hasHeader?headers.findIndex(x=>['卡组','deck'].includes(x)):2,tagsIndex=hasHeader?headers.findIndex(x=>['标签','tags','tag'].includes(x)):-1;if(frontIndex<0)frontIndex=0;if(backIndex<0)backIndex=1;const incoming=rows.slice(hasHeader?1:0).map(r=>({front:(r[frontIndex]||'').trim(),back:(r[backIndex]||'').trim(),deck:(deckIndex>=0?(r[deckIndex]||'').trim():'')||data.decks[0]||'默认卡组',tags:tagsIndex>=0?(r[tagsIndex]||'').trim():''})).filter(c=>c.front&&c.back);if(!incoming.length)throw Error('没有读到正面和背面都有内容的卡片');for(const c of incoming){if(!data.decks.includes(c.deck))data.decks.push(c.deck);data.cards.push({id:uid(),...c,interval:0,ease:2.5,reps:0,due:today(),created:Date.now()})}if(!save())throw Error('卡片已载入当前页面，但浏览器未能保存。请马上导出 JSON 备份，否则刷新后会丢失。');return incoming.length}
    async function loadBundledCards(){const marker=KEY+'-markji-loaded';if(localStorage.getItem(marker)==='1'){toast('这组马克记卡片已经载入过。');return}const button=$('[data-load-markji]');if(button)button.disabled=true;try{const response=await fetch(new URL('markji_cards.csv',document.baseURI));if(!response.ok)throw Error('暂时无法读取网站上的卡片文件。');const count=importRows(parseDelimited((await response.text()).replace(/^\ufeff/,'')));localStorage.setItem(marker,'1');setView('home');toast(`已载入 ${count} 张马克记卡片。`)}catch(e){if(button)button.disabled=false;toast(e.message||'载入马克记卡片失败。')}}
    async function importFile(file,kind){if(!file)return;try{if(kind==='json'){const backup=JSON.parse(await file.text());if(!Array.isArray(backup.cards)||!Array.isArray(backup.decks))throw Error('这不是忆格备份文件');if(!confirm(`导入 ${backup.cards.length} 张卡片并替换本机数据？`))return;data={decks:backup.decks,cards:backup.cards,reviews:backup.reviews||{}};save();toast('备份已恢复。')}else{const count=importRows(parseDelimited((await file.text()).replace(/^\ufeff/,'')));toast(`已导入 ${count} 张卡片。`)}setView('home')}catch(e){toast(e.message||'无法读取这个文件。')}finally{$('#importFile').value=''}}
    function clearData(){if(!confirm('清空这台设备浏览器中的全部卡组、卡片和复习记录？请先导出备份。'))return;data={decks:[],cards:[],reviews:{}};save();setView('home');toast('本机数据已清空。')}
    document.addEventListener('click',e=>{const b=e.target.closest('button,[data-view]');if(!b)return;if(b.dataset.view){setView(b.dataset.view);return}if(b.dataset.study!==undefined){startStudy(b.dataset.study);return}if(b.dataset.flip!==undefined){revealed=!revealed;renderStudy();return}if(b.dataset.grade){gradeCard(b.dataset.grade);return}if(b.hasAttribute('data-exit')){history.back();return}if(b.hasAttribute('data-new-deck')){askDeck();return}if(b.dataset.deleteDeck){deleteDeck(b.dataset.deleteDeck);return}if(b.hasAttribute('data-export-json')){exportJSON();return}if(b.hasAttribute('data-export-csv')){exportCSV();return}if(b.hasAttribute('data-clear')){clearData();return}if(b.hasAttribute('data-load-markji')){loadBundledCards();return}if(b.hasAttribute('data-import-json')){$('#importFile').accept='.json,application/json';$('#importFile').dataset.kind='json';$('#importFile').click();return}if(b.hasAttribute('data-import-csv')){$('#importFile').accept='.csv,.txt,text/csv,text/plain';$('#importFile').dataset.kind='csv';$('#importFile').click()}});
    $('#importFile').addEventListener('change',e=>importFile(e.target.files?.[0],e.target.dataset.kind||'json'));document.addEventListener('change',e=>{if(e.target.id==='csvImportFile')importFile(e.target.files?.[0],'csv')});
    content.addEventListener('submit',e=>{if(e.target.id!=='cardForm')return;e.preventDefault();const form=new FormData(e.target),deck=String(form.get('deck')).trim()||'默认卡组',front=String(form.get('front')).trim(),back=String(form.get('back')).trim();if(!front||!back)return;if(!data.decks.includes(deck))data.decks.push(deck);data.cards.push({id:uid(),deck,front,back,tags:String(form.get('tags')||'').trim(),interval:0,ease:2.5,reps:0,due:today(),created:Date.now()});save();setView('home');toast('卡片已添加，今天就可以开始复习。')});
    document.addEventListener('keydown',e=>{if(view!=='study')return;if(e.code==='Space'){e.preventDefault();if(!revealed){revealed=true;renderStudy()}}else if(revealed&&['1','2','3','4'].includes(e.key))gradeCard(({1:'again',2:'hard',3:'good',4:'easy'})[e.key])});
    save();render();
  })();
  </script>
